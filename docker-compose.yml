services:
  backend:
    build: ./backend
    ports:
      - "8000:80"
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - JWT_SECRET_KEY=change-me-in-production
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=localhost:8000
    depends_on:
      - backend
